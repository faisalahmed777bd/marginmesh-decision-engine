[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marginmesh-decision-engine"
version = "0.1.0"
description = "An explainable lot-level commercial decision engine for wholesale electronics offers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MarginMesh IQ" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
